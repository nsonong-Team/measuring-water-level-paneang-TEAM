<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ลำน้ำพะเนียง — สถานการณ์น้ำ จ.หนองบัวลำภู</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:auto;overflow-y:hidden}
body{font-family:'Kanit',sans-serif;background:#071a2e}
.wrap{overflow-x:auto;overflow-y:hidden;height:100vh;scroll-behavior:smooth}
.wrap::-webkit-scrollbar{height:8px}
.wrap::-webkit-scrollbar-track{background:#071a2e}
.wrap::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#0277bd,#00acc1);border-radius:4px}
.scene{position:relative;width:4400px;height:100vh;min-height:680px;overflow:hidden}

/* SKY */
.sky{position:absolute;top:0;left:0;right:0;height:36%;
background:linear-gradient(180deg,#01579b 0%,#0277bd 30%,#0288d1 55%,#039be5 80%,#4fc3f7 100%)}
.cloud{position:absolute;background:rgba(255,255,255,.12);border-radius:50%;filter:blur(18px)}
.cl{animation:cld 80s linear infinite}
@keyframes cld{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* MOUNTAINS */
.mtns{position:absolute;top:20%;left:0;right:0;height:20%;pointer-events:none}

/* TERRAIN */
.ground{position:absolute;bottom:0;left:0;right:0;height:48%}
.gfill{position:absolute;inset:0;background:linear-gradient(180deg,#4e342e 0%,#3e2723 40%,#2a1810 100%)}
.gtop{position:absolute;top:0;left:0;right:0;height:28px;background:linear-gradient(180deg,#43a047,#2e7d32,#1b5e20)}
.ggrass{position:absolute;top:-6px;left:0;right:0;height:10px;overflow:hidden}
.gblade{position:absolute;bottom:0;width:2px;border-radius:1px 1px 0 0;transform-origin:bottom;animation:sw 3s ease-in-out infinite}
@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* RIVER */
.river{position:absolute;left:0;right:0;height:110px;bottom:165px;overflow:hidden}
.rbody{position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,87,155,.6),rgba(2,119,189,.7),rgba(3,155,229,.5),rgba(79,195,247,.3))}
.rsurf{position:absolute;top:0;left:0;width:300%;height:12px;
background:repeating-linear-gradient(90deg,transparent 0%,rgba(255,255,255,.25) 5%,transparent 10%);animation:wf 3.5s linear infinite}
@keyframes wf{from{transform:translateX(0)}to{transform:translateX(-33.33%)}}
.rp{position:absolute;background:rgba(255,255,255,.12);border-radius:50%;animation:pf 5s linear infinite}
@keyframes pf{from{transform:translateX(0);opacity:.2}50%{opacity:.5}to{transform:translateX(-33.33%);opacity:.15}}
.rbed{position:absolute;left:0;right:0;height:55px;bottom:110px;
background:linear-gradient(180deg,#4e342e,#3e2723)}
.rbed-r{position:absolute;top:0;left:0;right:0;height:12px;background:repeating-linear-gradient(90deg,#5d4037 0px,#6d4c41 12px,#4e342e 24px)}
.rname{position:absolute;font-size:32px;font-weight:800;color:rgba(255,255,255,.05);letter-spacing:16px}

/* HEADER */
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;
background:linear-gradient(90deg,rgba(7,26,46,.96),rgba(1,87,155,.92),rgba(7,26,46,.96));
backdrop-filter:blur(10px);border-bottom:2px solid rgba(3,155,229,.3);
display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.hl{display:flex;align-items:center;gap:10px}
.hlogo{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#0277bd,#00acc1);font-size:20px;box-shadow:0 0 16px rgba(2,119,189,.4)}
.htitle{font-size:15px;font-weight:600;color:#e1f5fe}
.hsub{font-size:10px;color:#4fc3f7;font-weight:300}
.hr{display:flex;align-items:center;gap:14px}
.hk{text-align:center}.hkn{font-size:20px;font-weight:700}.hkl{font-size:8px;color:#4fc3f7}
.hbadge{display:flex;align-items:center;gap:4px;padding:3px 12px;border-radius:20px;
background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.25);font-size:10px;color:#69f0ae}
.hdot{width:6px;height:6px;border-radius:50%;background:#69f0ae;animation:p 1.6s ease infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.hback{display:flex;align-items:center;gap:4px;padding:5px 14px;border-radius:6px;
background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#90caf9;
font-size:11px;text-decoration:none;font-family:'Kanit';transition:.2s}
.hback:hover{background:rgba(255,255,255,.15)}

/* STATION */
.gs{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:10;transition:transform .3s}
.gs:hover{transform:translateY(-4px)}
.gtop2{display:flex;gap:6px;margin-bottom:6px}
.gbox{border-radius:6px;padding:4px 10px;font-size:14px;font-weight:700;text-align:center;
min-width:56px;font-family:'Sarabun';box-shadow:0 2px 8px rgba(0,0,0,.2);position:relative}
.gbox::after{content:attr(data-label);position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);
font-size:7px;color:rgba(255,255,255,.5);white-space:nowrap;font-weight:400}
.gbox.lv{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;border:1px solid rgba(76,175,80,.4)}
.gbox.lv.w{background:linear-gradient(135deg,#f57f17,#f9a825);color:#000}
.gbox.lv.c{background:linear-gradient(135deg,#c62828,#e53935);color:#fff}
.gbox.el{background:linear-gradient(135deg,#4527a0,#7b1fa2);color:#fff;border:1px solid rgba(149,117,205,.3)}

/* RULER */
.ruler{position:relative;width:26px;height:130px;background:linear-gradient(180deg,#ffe082,#ffb300,#ff8f00);
border-radius:3px;border:2px solid #e65100;box-shadow:0 3px 12px rgba(0,0,0,.3),inset 0 0 8px rgba(0,0,0,.1)}
.rmk{position:absolute;right:0;background:rgba(0,0,0,.5)}
.rmk.mj{width:14px;height:2px}.rmk.mn{width:7px;height:1px}
.rnum{position:absolute;right:16px;font-size:7px;color:rgba(0,0,0,.6);font-family:'Sarabun';font-weight:700}
.wfill{position:absolute;bottom:0;left:2px;right:2px;border-radius:0 0 1px 1px;
background:linear-gradient(180deg,rgba(33,150,243,.75),rgba(1,87,155,.9));transition:height 1.2s ease}
.wline{position:absolute;left:-5px;right:-5px;height:2px;background:#fff;
box-shadow:0 0 10px rgba(255,255,255,.9),0 0 20px rgba(33,150,243,.5);transition:bottom 1.2s ease}

/* INFO CARD */
.scard{background:rgba(7,26,46,.88);backdrop-filter:blur(8px);border:1px solid rgba(3,155,229,.15);
border-radius:8px;padding:8px 10px;margin-top:6px;min-width:135px;text-align:center;
box-shadow:0 4px 16px rgba(0,0,0,.3);transition:border-color .3s}
.gs:hover .scard{border-color:rgba(3,155,229,.4)}
.sn{font-size:11px;font-weight:600;color:#4fc3f7}
.sl{font-size:9px;color:rgba(79,195,247,.4);margin-bottom:3px}
.sd{font-size:9px;color:rgba(255,255,255,.5);line-height:1.5}
.sd b{font-weight:700}
.ss{display:inline-block;font-size:9px;font-weight:600;padding:2px 10px;border-radius:12px;margin-top:4px}
.ss.g{background:rgba(76,175,80,.15);color:#69f0ae;border:1px solid rgba(76,175,80,.25)}
.ss.y{background:rgba(255,214,0,.15);color:#ffd600;border:1px solid rgba(255,214,0,.25)}
.ss.r{background:rgba(255,23,68,.15);color:#ff5252;border:1px solid rgba(255,23,68,.25)}

/* DAM */
.dam{margin-top:4px;text-align:center}
.dam-shape{width:44px;height:28px;margin:0 auto;
background:linear-gradient(180deg,#78909c,#546e7a);border:2px solid #455a64;border-radius:3px 3px 0 0;position:relative}
.dam-shape::before{content:'';position:absolute;top:-7px;left:-5px;right:-5px;height:7px;background:#37474f;border-radius:3px}
.dam-shape::after{content:'';position:absolute;bottom:2px;left:4px;right:4px;height:3px;
background:repeating-linear-gradient(90deg,rgba(255,255,255,.15) 0px,rgba(255,255,255,.15) 3px,transparent 3px,transparent 6px)}
.dam-lbl{font-size:8px;color:#90a4ae;margin-top:1px}

/* DISTANCE */
.dist-seg{position:absolute;display:flex;align-items:center;z-index:5}
.dist-line{flex:1;height:2px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.2),rgba(255,255,255,.05))}
.dist-box{background:rgba(2,119,189,.85);color:#fff;padding:3px 10px;border-radius:4px;
font-size:10px;font-weight:600;white-space:nowrap;box-shadow:0 2px 8px rgba(2,119,189,.3);
font-family:'Sarabun'}
.travel-tag{position:absolute;z-index:6;
background:rgba(244,67,54,.85);color:#fff;padding:2px 10px;border-radius:14px;
font-size:10px;font-weight:500;white-space:nowrap;box-shadow:0 2px 8px rgba(244,67,54,.3);
display:flex;align-items:center;gap:4px}
.travel-tag::after{content:'▶';font-size:7px;opacity:.6}

/* SCROLL HINT */
.hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;
background:rgba(7,26,46,.85);backdrop-filter:blur(8px);border:1px solid rgba(3,155,229,.2);
border-radius:20px;padding:6px 20px;font-size:11px;color:#4fc3f7;transition:opacity .5s}

/* LEGEND */
.legend{position:fixed;bottom:16px;right:16px;z-index:100;background:rgba(7,26,46,.9);
backdrop-filter:blur(8px);border:1px solid rgba(3,155,229,.15);border-radius:8px;padding:10px 14px}
.leg-t{font-size:10px;font-weight:500;color:#4fc3f7;margin-bottom:4px}
.leg-i{display:flex;align-items:center;gap:6px;font-size:9px;color:rgba(255,255,255,.5);margin:2px 0}
.leg-d{width:10px;height:10px;border-radius:50%}
</style>
</head>
<body>
<div class="hdr">
<div class="hl">
<a href="index.html" class="hback">← กลับแผนที่หลัก</a>
<div class="hlogo">🌊</div>
<div><div class="htitle">ลำน้ำพะเนียง — จ.หนองบัวลำภู</div><div class="hsub" id="dtLbl"></div></div>
</div>
<div class="hr">
<div class="hk"><div class="hkn" style="color:#69f0ae" id="hG">0</div><div class="hkl">ปกติ</div></div>
<div class="hk"><div class="hkn" style="color:#ffd600" id="hY">0</div><div class="hkl">เฝ้าระวัง</div></div>
<div class="hk"><div class="hkn" style="color:#ff5252" id="hR">0</div><div class="hkl">วิกฤติ</div></div>
<div class="hbadge"><span class="hdot"></span>LIVE</div>
</div>
</div>
<div class="hint" id="hint">◀ เลื่อนซ้าย-ขวา ดูสถานีต้นน้ำ → ปลายน้ำ ▶</div>
<div class="legend">
<div class="leg-t">สัญลักษณ์</div>
<div class="leg-i"><span class="leg-d" style="background:#69f0ae"></span>ปกติ (ธงเขียว)</div>
<div class="leg-i"><span class="leg-d" style="background:#ffd600"></span>เฝ้าระวัง (ธงเหลือง)</div>
<div class="leg-i"><span class="leg-d" style="background:#ff5252"></span>วิกฤติ (ธงแดง)</div>
<div class="leg-i"><span style="width:10px;height:10px;background:linear-gradient(135deg,#78909c,#546e7a);border-radius:2px;display:inline-block"></span>ประตูระบายน้ำ</div>
</div>
<div class="wrap" id="wrap">
<div class="scene" id="sc">
<div class="sky"><div class="cl" id="clds" style="position:absolute;top:0;left:0;width:200%;height:100%"></div></div>
<div class="mtns" id="mtns"></div>
<div class="ground"><div class="gfill"></div><div class="gtop"></div><div class="ggrass" id="gr"></div></div>
<div class="river"><div class="rbody"></div><div class="rsurf"></div><div id="rps"></div></div>
<div class="rbed"><div class="rbed-r"></div></div>
<div class="rname" style="bottom:195px;left:300px">ลำน้ำพะเนียง</div>
<div class="rname" style="bottom:195px;left:2200px">PANEANG RIVER</div>
<div id="sLayer"></div>
</div>
</div>
<script>
const ST=[
{id:1,nm:"วังปลาป้อม",vl:"บ.โคกเจริญ",ap:"นาวัง",tb:"วังปลาป้อม",el:290,rd:290,yl:289.5,gm:289,ds:22.6},
{id:2,nm:"โคกกระทอ",vl:"บ.โคกกระทอ",ap:"นาวัง",tb:"นาเหล่า",el:266,rd:266,yl:265.5,gm:265,ds:12.18},
{id:3,nm:"วังสามหาบ",vl:"บ.วังสามหาบ",ap:"นาวัง",tb:"เทพคีรี",el:258,rd:258,yl:257.5,gm:257,ds:14},
{id:4,nm:"บ้านหนองด่าน",vl:"บ.หนองด่าน",ap:"นากลาง",tb:"ด่านช้าง",el:249,rd:249,yl:248.5,gm:248,ds:15.7},
{id:5,nm:"บ้านฝั่งแดง",vl:"บ.ฝั่งแดง",ap:"นากลาง",tb:"ฝั่งแดง",el:237,rd:237,yl:236.5,gm:236,ds:34.8},
{id:6,nm:"ปตร.หนองหว้าใหญ่",vl:"บ.หนองหว้าใหญ่",ap:"เมืองฯ",tb:"หนองหว้า",el:216,rd:216,yl:215.5,gm:215,ds:10,dm:1},
{id:7,nm:"วังหมื่น",vl:"บ.วังหมื่น",ap:"เมืองฯ",tb:"หนองบัว",el:210,rd:210,yl:209.5,gm:209,ds:18.8},
{id:8,nm:"ปตร.ปู่หลอด",vl:"บ.โนนคูณ",ap:"เมืองฯ",tb:"บ้านขาม",el:203,rd:203,yl:202.5,gm:202.5,ds:8.07,dm:1},
{id:9,nm:"บ้านข้องโป้",vl:"บ.ข้องโป้",ap:"เมืองฯ",tb:"บ้านขาม",el:201,rd:201,yl:200.5,gm:200,ds:20.7},
{id:10,nm:"ปตร.หัวนา",vl:"บ.ดอนหัน",ap:"เมืองฯ",tb:"หัวนา",el:191,rd:191,yl:190.5,gm:190,ds:0,dm:1}
];
let LV={};ST.forEach(s=>{const b=s.gm-1.5,r=s.rd-b;LV[s.id]=Math.round((b+Math.random()*r*.6)*100)/100});
function gs2(s,l){if(l>=s.rd)return{t:'วิกฤติ',c:'r',f:'ธงแดง',cls:'c',e:'🔴'};if(l>=s.yl)return{t:'เฝ้าระวัง',c:'y',f:'ธงเหลือง',cls:'w',e:'🟡'};return{t:'ปกติ',c:'g',f:'ธงเขียว',cls:'',e:'🟢'}}
function build(){
const el=document.getElementById('sLayer');const sp=400,sx=160;let h='';
ST.forEach((s,i)=>{
const x=sx+i*sp,lv=LV[s.id],st=gs2(s,lv);
const wp=Math.max(5,Math.min(82,((lv-(s.gm-3))/(s.rd-s.gm+4))*65+12));
h+=`<div class="gs" style="left:${x}px;bottom:255px">`;
h+=`<div class="gtop2"><div class="gbox lv ${st.cls}" data-label="ระดับน้ำ">${lv.toFixed(2)}</div><div class="gbox el" data-label="ม.รทก.">${s.el}</div></div>`;
h+=`<div class="ruler">`;
for(let m=0;m<=10;m++){const p=(1-m/10)*100;h+=`<div class="rmk mj" style="top:${p}%"></div>`;h+=`<div class="rnum" style="top:calc(${p}% - 4px)">${m*10}</div>`;
if(m<10)for(let u=1;u<=4;u++){h+=`<div class="rmk mn" style="top:${(1-(m+u*.2)/10)*100}%"></div>`}}
h+=`<div class="wfill" style="height:${wp}%"></div><div class="wline" style="bottom:${wp}%"></div></div>`;
h+=`<div class="scard"><div class="sn">${s.nm}</div><div class="sl">อ.${s.ap} ต.${s.tb}</div>`;
h+=`<div class="sd">ระดับ <b style="color:${st.c==='g'?'#69f0ae':st.c==='y'?'#ffd600':'#ff5252'}">${lv.toFixed(2)}</b> ม.รทก.<br>สูง <b style="color:#90caf9">${s.el}</b> ม.รทก.</div>`;
h+=`<div class="ss ${st.c}">${st.e} ${st.f}</div></div>`;
if(s.dm)h+=`<div class="dam"><div class="dam-shape"></div><div class="dam-lbl">${s.nm}</div></div>`;
h+=`</div>`;
if(i<ST.length-1){
const td=Math.max(1,Math.round(s.ds/12));
h+=`<div class="dist-seg" style="left:${x+75}px;bottom:128px;width:${sp-110}px"><div class="dist-line"></div><div class="dist-box">${s.ds} กม.</div><div class="dist-line"></div></div>`;
h+=`<div class="travel-tag" style="left:${x+sp/2-20}px;bottom:148px">${td} วัน</div>`}
});
h+=`<div style="position:absolute;bottom:55px;left:100px;right:100px;display:flex;align-items:center;z-index:5"><div style="flex:1;height:1px;background:rgba(255,255,255,.1)"></div><div style="padding:0 12px;font-size:10px;color:rgba(255,255,255,.3)">▲ ต้นน้ำ (${ST[0].el} ม.รทก.) ━━━ ระยะทางตามลำน้ำ ━━━ ปลายน้ำ (${ST[ST.length-1].el} ม.รทก.) ▼</div><div style="flex:1;height:1px;background:rgba(255,255,255,.1)"></div></div>`;
el.innerHTML=h}
function env(){
const c=document.getElementById('clds');let ch='';for(let i=0;i<25;i++){ch+=`<div class="cloud" style="width:${80+Math.random()*180}px;height:${25+Math.random()*50}px;left:${Math.random()*100}%;top:${5+Math.random()*55}%"></div>`}c.innerHTML=ch;
const m=document.getElementById('mtns');let mh='';const mc=['#1b5e20','#2e7d32','#388e3c','#33691e'];
for(let i=0;i<22;i++){const w=180+Math.random()*350,ht=50+Math.random()*90,x=i*200+Math.random()*80;
mh+=`<div style="position:absolute;bottom:0;left:${x}px;width:0;height:0;border-left:${w/2}px solid transparent;border-right:${w/2}px solid transparent;border-bottom:${ht}px solid ${mc[i%4]};opacity:${.3+Math.random()*.4}"></div>`}m.innerHTML=mh;
const g=document.getElementById('gr');let gh='';for(let i=0;i<550;i++){gh+=`<div class="gblade" style="left:${i*8}px;height:${4+Math.random()*7}px;background:linear-gradient(180deg,#81c784,#66bb6a);animation-delay:${Math.random()*3}s"></div>`}g.innerHTML=gh;
const p=document.getElementById('rps');let ph='';for(let i=0;i<50;i++){const w=2+Math.random()*3;
ph+=`<div class="rp" style="width:${w}px;height:${w}px;left:${Math.random()*100}%;top:${10+Math.random()*80}%;animation-duration:${3+Math.random()*4}s;animation-delay:${Math.random()*5}s"></div>`}p.innerHTML=ph}
function kpi(){let g=0,y=0,r=0;ST.forEach(s=>{const x=gs2(s,LV[s.id]);if(x.c==='g')g++;else if(x.c==='y')y++;else r++});
document.getElementById('hG').textContent=g;document.getElementById('hY').textContent=y;document.getElementById('hR').textContent=r}
function dt(){document.getElementById('dtLbl').textContent='10 สถานี | '+new Date().toLocaleString('th-TH',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function sim(){ST.forEach(s=>{LV[s.id]=Math.round((LV[s.id]+(Math.random()-.48)*.12)*100)/100});build();kpi()}
document.getElementById('wrap').addEventListener('scroll',()=>{const h=document.getElementById('hint');if(h){h.style.opacity='0';setTimeout(()=>h.style.display='none',500)}},{once:true});
env();build();kpi();dt();setInterval(sim,15000);setInterval(dt,60000);
</script>
</body>
</html>
